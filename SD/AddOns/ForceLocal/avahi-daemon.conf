# ForceLocal addon - avahi-daemon config
# Publishes the device's mDNS hostname (force.local) only.
# D-Bus is intentionally disabled so this addon never touches shared
# /etc/dbus-1 policy - it runs fully standalone via --no-drop-root.

[server]
enable-dbus=no
#host-name=foo
use-ipv4=yes
use-ipv6=yes
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=yes

[publish]
publish-hinfo=no
publish-workstation=no

[reflector]

[rlimits]
